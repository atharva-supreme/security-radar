name: watch

on:
  schedule:
    # Every 6 hours UTC, timed so one run lands at 07:00 IST, an hour before the
    # Claude routine reads report.json at 08:00 IST. Runs at 07:00, 13:00, 19:00, 01:00 IST.
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and compare, write report.json for inspection, commit nothing'
        type: boolean
        default: false
      forget:
        description: 'Comma-separated GHSA ids to drop from state so they count as new again'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          ARGS="--scan-only"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.forget }}" ]; then ARGS="$ARGS --forget ${{ inputs.forget }}"; fi
          node watch.mjs $ARGS

      - name: Show report
        if: always()
        run: cat report.json

      - name: Commit state and report
        if: always() && inputs.dry_run != true
        run: |
          git config user.name 'security-watch'
          git config user.email 'security-watch@users.noreply.github.com'
          git add state.json report.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

name: watch

on:
  schedule:
    # Once a day at 08:00 IST (02:30 UTC), an hour before the Claude routine reads
    # report.json at 09:00 IST and sends the Slack message and the email.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan and show report.json in the log, commit nothing'
        type: boolean
        default: false
      forget:
        description: 'Comma-separated advisory ids to drop from state so they count as new again'
        required: false
        default: ''
      discover:
        description: 'Re-discover lockfiles across the organisation and commit watchlist.json first'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Discover lockfiles
        if: inputs.discover == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: node scripts/discover.mjs

      - name: Scan
        env:
          # The workflow's own token gets 1,000 requests an hour; a user token gets 5,000.
          # Polling ~3,000 package repositories needs the larger budget on the first run.
          GITHUB_TOKEN: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
          SCAN_CONCURRENCY: '6'
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.forget }}" ]; then ARGS="$ARGS --forget ${{ inputs.forget }}"; fi
          node watch.mjs $ARGS

      - name: Show summary
        if: always()
        run: node -e "const r=require('./report.json'); console.log(JSON.stringify({status:r.status,summary:r.summary,projects:r.projects.map(p=>[p.project,p.branch,p.status,p.critical,p.high])},null,1))"

      - name: Commit state and report
        if: always() && inputs.dry_run != true
        run: |
          git config user.name 'security-radar'
          git config user.email 'security-radar@users.noreply.github.com'
          git add state.json packages.json report.json watchlist.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
